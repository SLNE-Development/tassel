name: Feature request
description: Suggest a new tool, workflow or MCP capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Tessel help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: References from other tools, sketches, example files
