name: Bug report
description: Something in Tessel does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a cube
        2. Enter edit mode
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tessel version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: mcp
    attributes:
      label: MCP / AI agent details
      description: If an agent was driving Tessel, which client was it and which tool calls were involved?
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, files or logs
